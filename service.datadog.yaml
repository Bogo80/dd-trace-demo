apiVersion: v3
kind: service
metadata:
  name: dd-demo
  displayName: DD Trace Demo
  owner: Bogo80
  contacts:
    - type: email
      contact: bogdan.birgu@datadoghq.com
  tags:
    - env:dev
    - language:python
